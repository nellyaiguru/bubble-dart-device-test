<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Bubble Dart</title>

<style>.hp-home[hidden] { display: none; }
.hp-home {
  --home-height: calc(100dvh - var(--safe-top) - var(--safe-bottom));
  padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  justify-items: center;
  overflow: auto;
  overscroll-behavior: contain;
  isolation: isolate;
}

.hp-stage {
  position: relative;
  align-self: center;
  display: grid;
  justify-items: center;
  width: min(100%, calc(var(--home-height) * 941 / 1672), 960px);
  container-type: inline-size;
}

.hp-stage::after { content: ''; height: 11.796cqw; }

.hp-art {
  position: relative;
  width: 100%;
  aspect-ratio: 941 / 1292;
  pointer-events: none;
  user-select: none;
}

.hp-logo {
  position: absolute;
  top: 1.70cqw;
  left: 11.90%;
  width: 76.20%;
  height: auto;
  filter: drop-shadow(0 2px 4px #fdf1af40);
}

.hp-action {
  position: absolute;
  inset: auto 0 0;
  aspect-ratio: 3074 / 2527;
  pointer-events: none;
  user-select: none;
}

.hp-piece {
  position: absolute;
  top: var(--sprite-y);
  left: var(--sprite-x);
  display: block;
  width: var(--sprite-width);
  height: auto;
}

.hp-settings {
  position: absolute;
  top: max(2.77cqw, var(--safe-top));
  right: max(2.77cqw, var(--safe-right));
  z-index: 2;
  display: grid;
  place-items: center;
  width: clamp(44px, 13.92cqw, 131px);
  aspect-ratio: 1;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.hp-cta {
  position: relative;
  display: grid;
  width: 75.24%;
  aspect-ratio: 708 / 244;
  min-height: 48px;
  margin-top: 2.66cqw;
}

.hp-rays {
  position: absolute;
  top: -17.21%;
  width: 15.40%;
  height: auto;
  pointer-events: none;
}

.hp-rays-left { left: -8.62%; }
.hp-rays-right { right: -8.20%; }

.hp-play, .level-plaque {
  --play-left: url('assets/8e3ee5656d4b4afed1085bdb.png');
  --play-middle: url('assets/3955a6907fad05a4241038dd.png');
  --play-right: url('assets/65df55bea0be28d249e88ddf.png');
}

.hp-play {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  min-height: 48px;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: #fff8da;
  container-type: size;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.hp-play:active {
  --play-left: url('assets/c6189aeb4cb40c96b48bccee.png');
  --play-middle: url('assets/044de3bd4ca53897f409df7b.png');
  --play-right: url('assets/d2837951f0b65182545cf876.png');
}

.hp-play-skin {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: min(32%, 68.85246cqh) minmax(0, 1fr) min(32%, 68.85246cqh);
  pointer-events: none;
  filter: drop-shadow(0 5px 5px #9f65504d);
}

.hp-play-skin > span {
  min-width: 0;
  background-size: 100% 100%;
  background-repeat: no-repeat;
}

.hp-play-skin > span:not(:last-child) { margin-right: -1px; }
.hp-play-skin > span:nth-child(1) { background-image: var(--play-left); }
.hp-play-skin > span:nth-child(2) { background-image: var(--play-middle); }
.hp-play-skin > span:nth-child(3) { background-image: var(--play-right); }

.hp-level-label {
  position: relative;
  top: -.07em;
  display: block;
  font-family: 'Bubble Poke Level', var(--port-cjk, sans-serif), sans-serif;
  font-weight: 750;
  font-synthesis: none;
  font-size: clamp(20px, 12.65cqw, 95px);
  line-height: 1.08;
  white-space: nowrap;
  text-shadow: 0 .05em .04em #3b711b, 0 .09em .07em #446d236b;
  user-select: none;
}

.hp-home button:focus-visible { outline: 3px solid #633e97; outline-offset: 2px; }
.hp-play:active > span { transform: translateY(2px); }

@media (hover: hover) {
  .hp-play:hover .hp-play-skin { filter: brightness(1.05) drop-shadow(0 5px 5px #9f65504d); }
}

body.dark .hp-home::after {
  content: '';
  position: absolute;
  inset: 0;
  background: #12213a5c;
  pointer-events: none;
  z-index: 1;
}

@media (orientation: landscape) {
  .hp-stage {
    width: min(100%, calc(var(--home-height) * 1.8), 1260px);
    grid-template-columns: 1.1fr 1fr;
    grid-template-rows: 1fr auto;
    align-items: center;
    column-gap: clamp(9px, 2vw, 32px);
    padding: clamp(12px, 2.5vw, 28px);
  }
  .hp-stage::after { display: none; }
  .hp-art { display: contents; }
  .hp-action { position: relative; inset: auto; grid-area: 1 / 1 / 3; width: 100%; }
  .hp-logo { position: static; grid-area: 1 / 2; align-self: end; width: 100%; }
  .hp-cta { grid-area: 2 / 2; align-self: start; width: 88%; margin-top: 5%; }
  .hp-settings { top: max(9px, var(--safe-top)); right: max(9px, var(--safe-right)); width: clamp(44px, 7cqw, 85px); }
}


body { background: var(--sky-edge) !important; }


@media (orientation: portrait) and (min-aspect-ratio: 1/2) {
  .hp-stage .hp-logo {
    top: 8cqw;
    left: 16%;
    width: 68%;
  }
}
* { box-sizing: border-box; }
:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --sky-edge: #76c6e3;
  --sky: radial-gradient(ellipse at 80% 5%, #fbf1c982 0, #fdf4d000 35%),
    linear-gradient(162deg, #218bdb 0, #51ccf1 45%, #b5e9f6 68%, #ffd9ee 100%);
  --sky-blend: none;
}
html, body { margin: 0; min-height: 100%; background-color: var(--sky-edge); }

/* Blend the artwork into the color used by the browser at the viewport edges. */
@media (any-pointer: coarse), (max-width: 600px) {
  :root {
    --sky-fade: clamp(24px, 6dvh, 56px);
    --sky-blend: linear-gradient(to bottom, var(--sky-edge),
      transparent max(var(--safe-top), var(--sky-fade)),
      transparent calc(100% - max(var(--safe-bottom), var(--sky-fade))), var(--sky-edge));
  }
}

html.release-starting #homeScreen {
  background: var(--sky-blend), var(--sky) var(--sky-edge);
}

html.release-starting :is(#gameScreen, .hp-toolbar, #homeChestButton, .hp-rays) {
  display: none !important;
}
html.release-starting #homeContinue,
html.release-starting #homeScreen:not(.art-ready) :is(.hp-art, #releaseLoading) {
  visibility: hidden;
}

.hp-illustration { display: block; width: 100%; height: auto; }

#releaseLoading {
  position: absolute; top: 50%; left: 50%; translate: -50% -50%;
  width: min(95%, 340px);
  height: clamp(12px, 2.8dvh, 20px);
  box-sizing: border-box; border: 2px solid #fff0c3; border-radius: 999px;
  background: #784b2d; overflow: hidden; box-shadow: 0 2px 0 #b1622d80;
}

#releaseLoading:not([data-load-failed])::before {
  content: ""; display: block; width: 88%; height: 100%; border-radius: inherit;
  background: linear-gradient(#fff79c, #ffda5b 48%, #ffac2f);
  transform-origin: left; animation: release-progress 4s cubic-bezier(.12,.65,.27,1) both;
}

@keyframes release-progress { from { transform: scaleX(.1); } to { transform: scaleX(1); } }

@media (prefers-reduced-motion: reduce) {
  #releaseLoading:not([data-load-failed])::before { animation: none; width: 55%; }
}

#releaseLoading[data-load-failed] {
  display: grid; place-items: center; width: auto; height: auto;
  background: #fff4db; border: 0; box-shadow: none;
}

#releaseLoading button {
  width: 48px; height: 48px; border: 0; background: transparent;
  color: #563567; font: 700 28px system-ui, sans-serif; cursor: pointer;
}</style>
</head>
