<style>html, body { margin: 0; min-height: 100%; background: #52c9e7; }

#releaseSplash {
  position: fixed; inset: 0; z-index: 200; display: grid; place-items: center;
  background: radial-gradient(ellipse at 80% 5%, #fbf1c982 0, #fdf4d000 35%),
    linear-gradient(162deg, #218bdb 0, #51ccf1 45%, #b5e9f6 68%, #ffd9ee 100%);
  overflow: hidden;
}

.splash-stage {
  width: min(95vw, 54dvh, 960px); display: grid; justify-items: center;
  visibility: hidden;
}

.splash-ready .splash-stage { visibility: visible; }
.splash-stage img { display: block; height: auto; }
.splash-logo { width: 76%; }
.splash-cat { width: 100%; margin-top: -4%; }

#releaseLoading {
  width: min(75%, 340px); margin: clamp(10px, 3dvh, 22px) auto 0;
  height: clamp(12px, 2.8dvh, 20px);
  box-sizing: border-box; border: 2px solid #fff0c3; border-radius: 999px;
  background: #784b2d; overflow: hidden; box-shadow: 0 2px 0 #b1622d80;
}

@media (orientation: landscape) {
  .splash-stage {
    width: min(94vw, 165dvh, 1200px); grid-template-columns: 1.1fr 1fr;
    grid-template-rows: 1fr 1fr; column-gap: clamp(8px, 2vw, 30px); align-items: center;
  }
  .splash-cat { grid-area: 1 / 1 / 3; margin: 0; }
  .splash-logo { grid-area: 1 / 2; width: 100%; align-self: end; }
  #releaseLoading { grid-area: 2 / 2; align-self: start; }
}

#releaseLoading:not([data-load-failed])::before {
  content: ""; display: block; width: 88%; height: 100%; border-radius: inherit;
  background: linear-gradient(#fff79c, #ffda5b 48%, #ffac2f);
  transform-origin: left; animation: release-progress 4s cubic-bezier(.12,.65,.27,1) both;
}

@keyframes release-progress { from { transform: scaleX(.1); } to { transform: scaleX(1); } }

@media (prefers-reduced-motion: reduce) {
  #releaseLoading:not([data-load-failed])::before { animation: none; width: 55%; }
}

#releaseLoading[data-load-failed] {
  display: grid; place-items: center; width: auto; height: auto;
  background: #fff4db; border: 0; box-shadow: none;
}

#releaseLoading button {
  width: 48px; height: 48px; border: 0; background: transparent;
  color: #563567; font: 700 28px system-ui, sans-serif; cursor: pointer;
}</style>
</head>
